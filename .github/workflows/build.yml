name: build-mxzf-dylib

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'MXYZFCheat.m'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build MXYZFCheat.dylib (arm64, no theos)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -dynamiclib \
            -fobjc-arc \
            -O2 \
            -o MXYZFCheat.dylib \
            MXYZFCheat.m
          file MXYZFCheat.dylib
          ls -la MXYZFCheat.dylib

      - name: Verify arm64 mach-o
        run: |
          vtool -show-build MXYZFCheat.dylib || true
          nm -gU MXYZFCheat.dylib | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: MXYZFCheat.dylib
          path: MXYZFCheat.dylib
